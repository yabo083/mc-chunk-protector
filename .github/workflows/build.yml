name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          MOD_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$MOD_VERSION"
          test "$GITHUB_REF_NAME" = "v$MOD_VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcchunkprotector-neoforge-1.21.1
          path: build/libs/mcchunkprotector-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NeoForge jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcchunkprotector-neoforge-1.21.1
          path: build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: build/libs/mcchunkprotector-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      # Third-party publishing is intentionally disabled during development.
      # - name: Publish to Modrinth
      #   uses: Kir-Antipov/mc-publish@v3.3
      #   with:
      #     files: build/libs/mcchunkprotector-*.jar
      #     loaders: neoforge
      #     game-versions: 1.21.1
      #     java: 21
      #     modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
      #     modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

